name: Apply CodeQL fixes

on:
  push:
    branches:
      - custom
    paths:
      - '.github/workflows/apply-codeql-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom
          fetch-depth: 0

      - name: Apply targeted fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              found = text.count(old)
              if found != expected:
                  raise SystemExit(f"{path}: expected {expected} match(es), found {found}")
              p.write_text(text.replace(old, new, expected), encoding="utf-8")
              print(f"patched {path}: {expected} replacement(s)")

          # CodeQL: multiplication performed as int before conversion to allocation size.
          replace_exact(
              "libhb/templates/nlmeans_template.c",
              """    pixel *mem   = malloc(bw * bh * sizeof(pixel));
              pixel *image = mem + border + bw * border;
          """,
              """    const size_t plane_size = (size_t)bw * (size_t)bh * sizeof(pixel);
              pixel *mem   = malloc(plane_size);
              pixel *image = mem + border + bw * border;
          """,
          )

          replace_exact(
              "libhb/templates/nlmeans_template.c",
              """        pixel *mem_pre = malloc(bw * bh * sizeof(pixel));
                  pixel *image_pre = mem_pre + border + bw * border;
                  memcpy(mem_pre, mem, bw * bh * sizeof(pixel));
          """,
              """        const size_t prefilter_size = (size_t)bw * (size_t)bh * sizeof(pixel);
                  pixel *mem_pre = malloc(prefilter_size);
                  pixel *image_pre = mem_pre + border + bw * border;
                  memcpy(mem_pre, mem, prefilter_size);
          """,
          )

          replace_exact(
              "libhb/motion_metric.c",
              """        int size = approx_height * approx_width * sizeof(uint8_t) * pv->bps;
          """,
              """        size_t size = (size_t)approx_height * (size_t)approx_width *
                              sizeof(uint8_t) * (size_t)pv->bps;
          """,
          )

          replace_exact(
              "libhb/decomb.c",
              """            int stride = hb_image_stride(init->pix_fmt, init->geometry.width, 0);

                      pv->cx2 = (int *)eedi2_aligned_malloc(init->geometry.height * stride * sizeof(int), 16);
                      pv->cy2 = (int *)eedi2_aligned_malloc(init->geometry.height * stride * sizeof(int), 16);
                      pv->cxy = (int *)eedi2_aligned_malloc(init->geometry.height * stride * sizeof(int), 16);
                      pv->tmpc = (int*)eedi2_aligned_malloc(init->geometry.height * stride * sizeof(int), 16);
          """,
              """            int stride = hb_image_stride(init->pix_fmt, init->geometry.width, 0);
                      const size_t derivative_size =
                          (size_t)init->geometry.height * (size_t)stride * sizeof(int);

                      pv->cx2 = (int *)eedi2_aligned_malloc(derivative_size, 16);
                      pv->cy2 = (int *)eedi2_aligned_malloc(derivative_size, 16);
                      pv->cxy = (int *)eedi2_aligned_malloc(derivative_size, 16);
                      pv->tmpc = (int*)eedi2_aligned_malloc(derivative_size, 16);
          """,
          )

          # CodeQL: test the allocation result, not the pointer-to-pointer parameter.
          replace_exact(
              "libhb/muxavformat.c",
              """        *priv_data = av_mallocz(extradata->size + AV_INPUT_BUFFER_PADDING_SIZE);
                  if (priv_data == NULL)
          """,
              """        *priv_data = av_mallocz(extradata->size + AV_INPUT_BUFFER_PADDING_SIZE);
                  if (*priv_data == NULL)
          """,
          )

          # CodeQL: validate _sub before dereferencing it.
          replace_exact(
              "libhb/common.c",
              """void hb_subtitle_close( hb_subtitle_t **_sub )
          {
              hb_subtitle_t * sub = *_sub;
              if ( _sub && sub )
              {
                  free((char*)sub->name);
                  free((char*)sub->config.name);
                  free((char*)sub->config.src_filename);
                  hb_data_close(&sub->extradata);
                  free(sub);
                  *_sub = NULL;
              }
          }
          """,
              """void hb_subtitle_close( hb_subtitle_t **_sub )
          {
              if (_sub == NULL || *_sub == NULL)
              {
                  return;
              }

              hb_subtitle_t * sub = *_sub;
              free((char*)sub->name);
              free((char*)sub->config.name);
              free((char*)sub->config.src_filename);
              hb_data_close(&sub->extradata);
              free(sub);
              *_sub = NULL;
          }
          """,
          )
          PY

          git diff --check
          git diff --stat
          git diff -- \
            libhb/templates/nlmeans_template.c \
            libhb/motion_metric.c \
            libhb/decomb.c \
            libhb/muxavformat.c \
            libhb/common.c

      - name: Commit fixes and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-codeql-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/apply-codeql-fixes.yml \
            libhb/templates/nlmeans_template.c \
            libhb/motion_metric.c \
            libhb/decomb.c \
            libhb/muxavformat.c \
            libhb/common.c
          git commit -m "Fix actionable CodeQL findings"
          git push origin HEAD:custom
